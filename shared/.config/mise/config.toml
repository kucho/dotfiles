[env]
FNOX_AGE_KEY_FILE = "~/.ssh/Personal SSH Key"

[settings]
auto_update = true
idiomatic_version_file_enable_tools = ["ruby"]
minimum_release_age = "7d"
minimum_release_age_excludes = ["pi"]
status = { missing_tools = "always" }

[bootstrap.macos.launchd.agents.elasticsearch]
program = "~/.local/share/mise/installs/elasticsearch/7/bin/elasticsearch"
run_at_load = true
keep_alive = true
working_directory = "~/.local/share/mise/installs/elasticsearch/7"
stdout_path = "~/Library/Logs/elasticsearch.log"
stderr_path = "~/Library/Logs/elasticsearch.err.log"

[bootstrap.linux.systemd.units.elasticsearch]
description = "Elasticsearch"
exec_start = "~/.local/share/mise/installs/elasticsearch/7/bin/elasticsearch"
working_directory = "~/.local/share/mise/installs/elasticsearch/7"
restart = "always"
restart_sec = "5s"
timeout_start_sec = "120"
standard_output = "journal"
standard_error = "journal"

[bootstrap.macos.launchd.agents.mysql]
program = "~/.config/mise/scripts/mysql-server.sh"
run_at_load = true
keep_alive = true
working_directory = "~/.local/share/mysql"
stdout_path = "~/Library/Logs/mysql.log"
stderr_path = "~/Library/Logs/mysql.err.log"

[bootstrap.linux.systemd.units.mysql]
description = "MySQL"
exec_start = "~/.config/mise/scripts/mysql-server.sh"
working_directory = "~/.local/share/mysql"
restart = "always"
restart_sec = "5s"
timeout_start_sec = "120"
standard_output = "journal"
standard_error = "journal"

[tools]
age = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
biome = "latest"
codex = "latest"
delta = "latest"
difftastic = "latest"
elasticsearch = "7"
elixir = "latest"
erlang = "latest"
fnox = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
lazydocker = "latest"
lazygit = "latest"
lsd = "latest"
mysql = { version = "8", postinstall = "bash ~/.config/mise/scripts/mysql-postinstall.sh" }
node = "lts"
pi = "latest"
ruby = { version = "latest", depends = ["rust"] }
rust = { version = "latest", components = "rust-analyzer,rust-src" }
starship = { version = "latest", postinstall = "starship preset pure-preset -o ~/.config/starship.toml" }
usage = "latest"
zoxide = "latest"

# Node.js
"npm:@herb-tools/language-server" = "latest"
"npm:agent-browser" = "latest"
# AWS only publishes a macOS zip to aqua; Linux gets a .deb. Use http + postinstall for both.
[tools."http:session-manager-plugin"]
version = "latest"
version_list_url = "https://api.github.com/repos/aws/session-manager-plugin/releases"
version_json_path = ".[].tag_name"
version_expr = "reverse(versions)"
postinstall = "bash ~/.config/mise/scripts/session-manager-plugin-postinstall.sh"

[tools."http:session-manager-plugin".platforms]
linux-x64 = { url = "https://s3.amazonaws.com/session-manager-downloads/plugin/{{ version }}/ubuntu_64bit/session-manager-plugin.deb" }
linux-arm64 = { url = "https://s3.amazonaws.com/session-manager-downloads/plugin/{{ version }}/ubuntu_arm64/session-manager-plugin.deb" }
macos-x64 = { url = "https://s3.amazonaws.com/session-manager-downloads/plugin/{{ version }}/mac/sessionmanager-bundle.zip" }
macos-arm64 = { url = "https://s3.amazonaws.com/session-manager-downloads/plugin/{{ version }}/mac_arm64/sessionmanager-bundle.zip" }
