[bootstrap.user]
login_shell = "/usr/bin/fish"

[env]
SSH_AUTH_SOCK = """
{%- if get_env(name="SSH_CONNECTION", default="") -%}
{{ get_env(name="SSH_AUTH_SOCK", default="") }}
{%- else -%}
{{ get_env(name="XDG_RUNTIME_DIR", default="/run/user/1000") }}/ssh-agent.socket
{%- endif -%}
"""
# Grok's Wayland data-control copy reports success but does not stick on KDE;
# force wl-copy so drag-select reaches the clipboard.
GROK_CLIPBOARD_NO_DATA_CONTROL = "1"

[bootstrap.packages]
"pacman:fish" = "latest"

[bootstrap.linux.systemd.units.ssh-agent]
description = "OpenSSH key agent"
exec_start = "~/.config/mise/scripts/ssh-agent-with-key.sh"
environment = { SSH_AUTH_SOCK = "%t/ssh-agent.socket" }
restart = "always"
restart_sec = "5s"
standard_output = "journal"
standard_error = "journal"

[bootstrap.linux.systemd.units.elasticsearch]
description = "Elasticsearch"
exec_start = "~/.local/share/mise/installs/elasticsearch/7/bin/elasticsearch"
working_directory = "~/.local/share/mise/installs/elasticsearch/7"
restart = "always"
restart_sec = "5s"
timeout_start_sec = "120"
standard_output = "journal"
standard_error = "journal"

[bootstrap.linux.systemd.units.mysql]
description = "MySQL"
exec_start = "~/.config/mise/scripts/mysql-server.sh"
working_directory = "~/.local/share/mysql"
restart = "always"
restart_sec = "5s"
timeout_start_sec = "120"
standard_output = "journal"
standard_error = "journal"
